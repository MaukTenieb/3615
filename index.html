<style>
/* K Terminal — boîtier, écran cathodique et clavier */
:root {
  color-scheme: dark;
  --desk: #191613;
  --desk-hi: #2c261f;
  --ink: #e9e1d0;
  --ink-dim: #a99f8c;
  --shell: #ddd5c3;
  --shell-lo: #c7bda7;
  --shell-edge: #a89d86;
  --bezel: #33281f;
  --bezel-hi: #4b3d31;
  --key: #4d4034;
  --key-lo: #2a2019;
  --key-ink: #f1e9d8;
  --fkey: #a39e92;
  --fkey-lo: #6f6a60;
  --fkey-ink: #221c16;
  --brick: #b9462f;
  --brick-lo: #7d2c1c;
  --led: #ff5a36;
  --led-green: #7cf25d;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --text: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "VT323", "Courier New", monospace;
}

* { box-sizing: border-box; }
html, body { height: auto; }
body {
  margin: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 18%, var(--desk-hi), var(--desk) 70%) fixed, var(--desk);
  color: var(--ink);
  font: 15px/1.5 var(--text);
  -webkit-font-smoothing: antialiased;
}

.desk {
  max-width: 900px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 20px 40px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

/* ---------- En-tête ---------- */
.topline {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px 16px;
  padding-inline: 6px;
}
.topline-name {
  font: 700 22px/1 var(--display);
  letter-spacing: .08em;
  text-transform: uppercase;
}
.topline-sub {
  font: 500 14px/1 var(--display);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

/* ---------- Capot et écran ---------- */
.terminal { width: 100%; }
.hood {
  position: relative;
  background: linear-gradient(180deg, #e7e0d0 0%, var(--shell) 40%, var(--shell-lo) 100%);
  border-radius: 34px 34px 16px 16px;
  padding: clamp(12px, 3vw, 28px) clamp(12px, 3vw, 28px) 14px;
  box-shadow:
    0 34px 60px rgba(0, 0, 0, .55),
    inset 0 2px 0 rgba(255, 255, 255, .7),
    inset 0 -4px 0 rgba(0, 0, 0, .12);
}
.bezel {
  background: radial-gradient(ellipse 90% 70% at 50% 35%, var(--bezel-hi), var(--bezel) 72%);
  border-radius: 26px;
  padding: clamp(10px, 2.6vw, 26px);
  box-shadow:
    inset 0 4px 12px rgba(0, 0, 0, .65),
    inset 0 -2px 0 rgba(255, 255, 255, .06),
    0 1px 0 rgba(255, 255, 255, .6);
}
.crt {
  position: relative;
  width: 100%;
  max-width: 100%;
  padding: 2.6% 3.2%;
  background: #040504;
  border-radius: 4% / 5%;
  overflow: hidden;
  box-shadow: 0 0 0 3px #16110d, inset 0 0 0 1px #000;
  cursor: default;
}
.crt canvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 960 / 750;
  filter: drop-shadow(0 0 2px rgba(226, 240, 230, .45)) contrast(1.04);
  transition: opacity .35s ease, transform .35s ease;
}
.crt.color canvas { filter: drop-shadow(0 0 2px rgba(255, 255, 255, .35)) saturate(1.05); }
.crt-scan, .crt-glass { position: absolute; inset: 0; pointer-events: none; }
.crt-scan {
  background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, .22) 0 1px, transparent 1px 3px);
  mix-blend-mode: multiply;
}
.crt-glass {
  border-radius: inherit;
  background:
    radial-gradient(ellipse 70% 45% at 28% 12%, rgba(255, 255, 255, .07), transparent 60%),
    linear-gradient(112deg, transparent 40%, rgba(255, 255, 255, .028) 46%, rgba(255, 255, 255, .05) 50%, rgba(255, 255, 255, .025) 54%, transparent 61%),
    radial-gradient(ellipse 45% 32% at 86% 92%, rgba(255, 255, 255, .035), transparent 60%),
    radial-gradient(ellipse at 50% 50%, transparent 58%, rgba(0, 0, 0, .55) 100%);
  box-shadow: inset 0 0 40px rgba(0, 0, 0, .7);
}
.crt-grime {
  position: absolute; inset: 0; pointer-events: none;
  border-radius: inherit;
  background-image:
    url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='160'%20height='160'%3E%3Cfilter%20id='g'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.9'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20type='saturate'%20values='0'/%3E%3C/filter%3E%3Crect%20width='160'%20height='160'%20filter='url(%23g)'/%3E%3C/svg%3E"),
    url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='480'%20height='480'%3E%3Cfilter%20id='s'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.012%200.016'%20numOctaves='3'%20seed='7'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20type='matrix'%20values='0%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200.8%20-0.52'/%3E%3C/filter%3E%3Crect%20width='480'%20height='480'%20filter='url(%23s)'/%3E%3C/svg%3E");
  background-size: 160px 160px, 480px 480px;
  mix-blend-mode: soft-light;
  opacity: .55;
}
.crt.off canvas { opacity: 0; transform: scale(1, .004); }
.crt.boot canvas { animation: boot .55s ease-out; }
@keyframes boot {
  0% { transform: scale(1, .004); opacity: .9; filter: brightness(3); }
  45% { transform: scale(1, .004); opacity: 1; }
  100% { transform: scale(1, 1); }
}
.crt.drop { box-shadow: 0 0 0 3px var(--brick), inset 0 0 0 1px #000; }

/* ---------- Bandeau de réglages ---------- */
.strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px 18px;
  padding: 14px 6px 2px;
  color: #3a3026;
}
.plate { display: flex; align-items: baseline; gap: 10px; }
.plate-model {
  font: 700 24px/1 var(--display);
  letter-spacing: .06em;
  color: var(--bezel);
}
.plate-kind {
  font: 600 12px/1 var(--display);
  letter-spacing: .2em;
  text-transform: uppercase;
  color: #6c604f;
}
.leds { display: flex; gap: 14px; }
.led {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: 600 11px/1 var(--display);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: #6c604f;
}
.led i {
  width: 9px; height: 9px; border-radius: 50%;
  background: #5a2b20;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, .6);
}
.led.on i { background: var(--led); box-shadow: 0 0 8px var(--led), inset 0 -1px 2px rgba(0, 0, 0, .3); }
.led.blink i { animation: ledblink .5s steps(2) infinite; }
.led-data i { background: #2f4a28; }
.led-data.on i { background: var(--led-green); box-shadow: 0 0 8px var(--led-green); animation: ledflicker .12s steps(2) infinite; }
@keyframes ledblink { 50% { background: var(--led); box-shadow: 0 0 8px var(--led); } }
@keyframes ledflicker { 50% { opacity: .45; } }

.controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; }
.ctl { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.ctl-label {
  font: 600 10px/1 var(--display);
  letter-spacing: .2em;
  text-transform: uppercase;
  color: #6c604f;
}
.seg {
  display: flex;
  background: var(--shell-edge);
  border-radius: 7px;
  padding: 2px;
  gap: 2px;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, .35);
}
.seg button {
  font: 600 13px/1 var(--display);
  letter-spacing: .04em;
  border: 0;
  border-radius: 5px;
  padding: 6px 8px;
  min-width: 40px;
  background: transparent;
  color: #3a3026;
  cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.seg button[aria-pressed="true"] {
  background: var(--bezel);
  color: var(--key-ink);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .3);
}
.toggle {
  width: 42px; height: 24px; border: 0; border-radius: 12px; padding: 0;
  background: var(--shell-edge);
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, .4);
  position: relative; cursor: pointer;
}
.toggle i {
  position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
  background: linear-gradient(#f5efe2, #d4cab5);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .45);
  transition: transform .15s ease;
}
.toggle[aria-checked="true"] { background: var(--bezel); }
.toggle[aria-checked="true"] i { transform: translateX(18px); }
.power {
  width: 34px; height: 34px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
  background: radial-gradient(circle at 40% 35%, #f3ecdd, #bdb29b);
  box-shadow: 0 2px 0 var(--shell-edge), 0 3px 6px rgba(0, 0, 0, .35);
  display: grid; place-items: center;
}
.power i {
  width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid #6c604f; border-top-color: transparent;
  position: relative;
}
.power[aria-pressed="true"] i { border-color: var(--brick); border-top-color: transparent; }
.power:active { transform: translateY(1px); }
.kbd-btn {
  height: 24px; min-width: 42px; border-radius: 6px; border: 0; cursor: pointer;
  font: 600 13px/1 var(--display);
  background: var(--bezel); color: var(--key-ink);
}
.ctl-kbd { display: none; }
@media (pointer: coarse) { .ctl-kbd { display: flex; } }

/* ---------- Clavier ---------- */
.deck {
  width: 96%;
  margin: -4px auto 0;
  padding: 18px;
  background: linear-gradient(180deg, #cfc6b1 0%, #bdb39c 100%);
  border-radius: 10px 10px 30px 30px;
  box-shadow: 0 26px 44px rgba(0, 0, 0, .5), inset 0 2px 0 rgba(255, 255, 255, .35), inset 0 -3px 0 rgba(0, 0, 0, .12);
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 18px;
  align-items: start;
}
.keys {
  display: grid;
  grid-template-columns: repeat(10, minmax(0, 1fr));
  gap: 6px;
}
.k, .fk {
  border: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none;
  transition: transform .05s ease, box-shadow .05s ease;
}
.k {
  height: 38px;
  border-radius: 6px;
  font: 600 16px/1 var(--display);
  color: var(--key-ink);
  background: linear-gradient(180deg, #5a4b3e, var(--key));
  box-shadow: 0 3px 0 var(--key-lo), inset 0 1px 0 rgba(255, 255, 255, .14);
}
.k-space { grid-column: span 3; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }
.fkeys {
  display: grid;
  grid-template-columns: repeat(2, 118px);
  gap: 6px;
}
.fk {
  min-height: 38px;
  padding: 4px 6px;
  border-radius: 6px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  font: 700 13px/1.05 var(--display);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--fkey-ink);
  background: linear-gradient(180deg, #b3aea2, var(--fkey));
  box-shadow: 0 3px 0 var(--fkey-lo), inset 0 1px 0 rgba(255, 255, 255, .35);
}
.fk small {
  font: 500 10px/1 var(--display);
  letter-spacing: .06em;
  text-transform: none;
  opacity: .62;
}
/* ENVOI : même gris que les autres touches ; halo électroluminescent autour,
   porté par un pseudo-élément derrière la touche (jamais sur elle) */
.fk-send { position: relative; z-index: 0; }
@keyframes sendglow {
  0%, 100% { opacity: .45; transform: scale(.97); }
  50% { opacity: .85; transform: scale(1); }
}
.fk-send::before {
  content: '';
  position: absolute;
  inset: -7px;
  z-index: -1;
  border-radius: 12px;
  background: radial-gradient(ellipse at center, rgba(255, 130, 55, .55) 0%, rgba(255, 130, 55, .20) 45%, rgba(255, 130, 55, 0) 72%);
  animation: sendglow 4.5s ease-in-out infinite;
  pointer-events: none;
}
.fk-send:active::before, .fk-send.down::before { animation: none; opacity: .3; }
.fk-cx {
  grid-column: span 2;
  color: #fff3e8;
  background: linear-gradient(180deg, #c95238, var(--brick));
  box-shadow: 0 3px 0 var(--brick-lo), inset 0 1px 0 rgba(255, 255, 255, .25);
}
.k:active, .k.down, .fk:active, .fk.down { transform: translateY(2px); box-shadow: 0 1px 0 var(--key-lo); }
.fk:active, .fk.down { box-shadow: 0 1px 0 var(--fkey-lo); }
.fk-cx:active, .fk-cx.down { box-shadow: 0 1px 0 var(--brick-lo); }
button:focus-visible { outline: 2px solid #f1dc3c; outline-offset: 2px; }

.kbd-sink {
  position: fixed; left: -200px; bottom: 0; width: 100px; height: 20px;
  opacity: 0; border: 0; padding: 0; font-size: 16px; resize: none;
}

/* ---------- Petits écrans ---------- */
/* low landscape screens (phone on its side, framed in Insert Koin): the whole screen fits the height, the rest scrolls below */
@media (orientation: landscape) and (max-height: 520px) {
  .desk { padding-block: 8px 24px; gap: 12px; }
  .terminal { max-width: calc((100svh - 16px) / .9); margin-inline: auto; }
  .hood { border-radius: 22px 22px 12px 12px; }
}
@media (max-width: 720px) {
  .deck { grid-template-columns: minmax(0, 1fr); width: 100%; padding: 12px; }
  .fkeys { order: -1; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .fk-cx { grid-column: span 4; }
  .k, .fk { min-height: 44px; }
  .manual { grid-template-columns: minmax(0, 1fr); }
  .strip { justify-content: center; }
}
@media (max-width: 420px) {
  .keys { gap: 4px; }
  .k { font-size: 15px; }
  .fk { font-size: 11px; letter-spacing: .04em; }
  .fk small { display: none; }
  .controls { justify-content: center; }
}
@media (prefers-reduced-motion: reduce) {
  .crt.boot canvas { animation: none; }
  .led.blink i, .led-data.on i { animation: none; }
}
.topline-kor { text-transform: none; letter-spacing: .08em; font-size: 16px; color: var(--ink-dim); text-decoration: none; border-bottom: 1px solid transparent; }
.topline-kor:hover, .topline-kor:focus-visible { color: var(--ink); border-bottom-color: currentColor; outline: none; }
/* inside Insert Koin the page frame already names the 3615: no second header */
html.framed .topline { display: none; }
</style>
</head>

  </header>

  <section class="terminal" data-fr-label="Terminal Vidéotex" data-en-label="Videotex terminal" aria-label="Terminal Vidéotex">

      <div class="bezel">
        <div class="crt" id="crt">

          <div class="ctl">

              <button type="button" id="baud-1200" data-baud="1200" aria-pressed="false">1200</button>
              <button type="button" id="baud-4800" data-baud="4800" aria-pressed="true">4800</button>
              <button type="button" id="baud-9600" data-baud="9600" aria-pressed="false">9600</button>
              <button type="button" id="baud-0" data-baud="0" aria-pressed="false">Max</button>
            </div>
          </div>
          <div class="ctl">
            <span class="ctl-label" data-fr="Couleur" data-en="Colour">Couleur</span>
            <button type="button" class="toggle" id="sw-color" role="switch" aria-checked="false" data-fr-label="Écran couleur" data-en-label="Colour screen" aria-label="Écran couleur"><i></i></button>

            <button type="button" class="kbd-btn" id="kbd-btn" data-fr-label="Ouvrir le clavier du téléphone" data-en-label="Open the phone keyboard" aria-label="Ouvrir le clavier du téléphone">Aa</button>

          <div class="ctl">
            <span class="ctl-label" data-fr="Marche" data-en="Power">Marche</span>

          </div>

    <div class="deck">

<script>
/* ---- js/i18n.js ---- */
/* ==========================================================================
   Traduction français / anglais du terminal.
   L(fr, en) renvoie le texte dans la langue choisie ; K(nom) donne le nom
   d'une touche de fonction (ENVOI → SEND…). La langue est gardée dans le
   navigateur ; par défaut, celle du navigateur.
   ========================================================================== */
(function (global) {
  'use strict';
  var lang = 'fr';
  try {
    lang = localStorage.getItem('vdx.lang') ||
      ((navigator.language || 'fr').slice(0, 2).toLowerCase() === 'fr' ? 'fr' : 'en');
  } catch (e) { /* rien */ }
  if (lang !== 'en') lang = 'fr';
  try { document.documentElement.lang = lang; } catch (e) { /* rien */ }

  var KEYS_EN = {
    'SOMMAIRE': 'INDEX', 'ANNULATION': 'CANCEL', 'RETOUR': 'BACK', 'REPETITION': 'REPEAT',
    'GUIDE': 'GUIDE', 'CORRECTION': 'CORRECT', 'SUITE': 'NEXT', 'ENVOI': 'SEND',
    'CONNEXION/FIN': 'CONNECT/END', 'CONNEXION': 'CONNECT'
  };
  var MONTHS = {
    fr: ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'],
    en: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']
  };
  var DAYS = {
    fr: ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'],
    en: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday']
  };
  var listeners = [];

  var I = {
    get lang() { return lang; },
    set: function (l) {
      lang = l === 'en' ? 'en' : 'fr';
      try { localStorage.setItem('vdx.lang', lang); } catch (e) { /* rien */ }
      try { document.documentElement.lang = lang; } catch (e) { /* rien */ }
      listeners.forEach(function (fn) { fn(lang); });
    },
    on: function (fn) { listeners.push(fn); },
    L: function (fr, en) { return lang === 'en' && en !== undefined ? en : fr; },
    K: function (name) { return lang === 'en' ? (KEYS_EN[name] || name) : name; },
    month: function (m) { return MONTHS[lang][m]; },
    day: function (d) { return DAYS[lang][d]; },
    dayShort: function (d) { return DAYS[lang][d].slice(0, 3).replace(/^./, function (c) { return c.toUpperCase(); }); },

    dayMonth: function (day, month) {
      return lang === 'en' ? MONTHS.en[month - 1] + ' ' + day : day + ' ' + MONTHS.fr[month - 1];

    applyDom: function (root) {
      (root || document).querySelectorAll('[data-fr]').forEach(function (el) {

      });

      });

        el.setAttribute('aria-label', el.getAttribute('data-' + lang + '-label'));
      });
      (root || document).querySelectorAll('[data-fr-title]').forEach(function (el) {
        el.setAttribute('title', el.getAttribute('data-' + lang + '-title'));
      });
    }
  };
  global.I18N = I;
  global.L = I.L;
  global.K = I.K;
})(window);

      if (G2_SPECIAL[b]) this.put(G2_SPECIAL[b], 0);

    /* ----- tchat ----- */
    joinRoom: function (room) {
      var self = this, h = this.h;
      if (this.sub) { try { this.sub.close(); } catch (e) { /* rien */ } this.sub = null; }
      this.room = room; this.view = 'chat';
      this.msgs = []; this.seen = {}; this.row = LOG_TOP; this.rid = null;
      NET.setRoom(room);
      this.r_chat();
      sha256hex(TAG + ':' + room).then(function (rid) {
        if (self.view !== 'chat' || self.room !== room || h.svc !== M || !NET.pool) return;
        self.rid = rid;
        var since = now() - 6 * 3600, loaded = false, backlog = [];
        self.sub = NET.pool.subscribe(RELAYS, { kinds: [42], '#e': [rid], since: since, limit: 60 }, {
          onevent: function (ev) {
            if (self.seen[ev.id]) return; self.seen[ev.id] = 1;
            if (!loaded) backlog.push(ev); else self.show(ev);
          },
          oneose: function () {
            if (loaded) return;
            loaded = true;
            backlog.sort(function (a, b) { return a.created_at - b.created_at; }).slice(-14).forEach(function (ev) { self.show(ev); });
            self.status();
          }
        });
        setTimeout(function () { if (!loaded) { loaded = true; backlog.forEach(function (ev) { self.show(ev); }); self.status(); } }, 6000);
      });
    },
    // Quitte le Kave en cours (le signal de présence le retire)
    stopChat: function () {
      if (this.sub) { try { this.sub.close(); } catch (e) { /* rien */ } this.sub = null; }
      if (NET.room) NET.setRoom('');
    },

    },
    maskTag: function (ev) {
      var t = ev.tags.filter(function (x) { return x[0] === 'mask'; })[0];
      return (t && t[1]) || NET.maskOf(ev.pubkey);
    },
    here: function () {
      return NET.inRoom(this.room).map(function (pk) {
        var p = pk === NET.pk ? { nick: NET.nick(), mask: NET.mask() } : NET.pres[pk];
        var m = maskByCode(p.mask);
        return (p.nick || '?') + (m ? ' (' + norm(m.name) + ')' : '');
      });
    },
    r_chat: function () {
      var h = this.h, v = new Vdt(), m = maskByCode(this.room);

      v.cls().cur(0);
      v.pos(1, 1).fg(7).inv(1).text(L(' KAVE ', ' KAVE ')).inv(0).fg(m ? maskColor(m.code) : 3).text(' ' + cut(lbl, 18));

      v.pos(21, 1).g1().fg(3).rep(0x23, 40).g0();

    status: function () {

    show: function (ev) {
      var m = { pk: ev.pubkey, n: this.nickOf(ev), mask: this.maskTag(ev), t: ev.created_at, text: ev.content };
      this.msgs.push(m);
      if (this.msgs.length > 100) this.msgs.shift();
      this.lines(m);
      this.h.refocus();
      if (ev.pubkey !== NET.pk) this.h.snd.top(false);
    },
    lines: function (m) {

      body.forEach(function (l, i) {

        if (i === 0) v.fg(col).text(l.slice(0, first.length)).fg(7).text(l.slice(first.length));

    sys: function (text) {

    k_chat: function (k, vals) {
      var h = this.h, self = this;
      if (k.fn === 'SOMMAIRE') { this.stopChat(); this.view = 'rooms'; this.render(); return true; }
      if (k.fn !== 'ENVOI') return false;
      var q = (vals[0] || '').trim();
      h.clearField(0);
      if (!q) return true;
      var cmd = q.match(/^\/(\w)\s*(.*)$/);
      if (cmd) {
        var c = cmd[1].toLowerCase(), arg = cmd[2].trim();
        if (c === 's') {
          var mk = arg ? maskByQuery(arg) : null;
          this.joinRoom(!arg || arg === '0' ? HALL : mk ? mk.code : (cleanNick(arg) || HALL));
          return true;
        }
        if (c === 'p') { this.sys(L('Présents : ', 'Here: ') + this.here().join(', ')); return true; }

        .catch(function () { self.sys(L('Message non transmis : réseau injoignable.', 'Message not sent: network unreachable.')); h.bell(); });

    k_write: function (k, vals) {
      var h = this.h, self = this;
      if (k.fn === 'SOMMAIRE') { this.to = ''; this.toPk = null; this.view = 'menu'; this.render(); return true; }
      if (k.fn !== 'ENVOI') return false;
      var who = (vals[0] || '').trim(), subj = (vals[1] || '').trim();
      var body = vals.slice(2).map(function (l) { return l.replace(/\s+$/, ''); });
      while (body.length && !body[body.length - 1]) body.pop();
      if (!body.length) { UI.message(h, L('Le message est vide.', 'The message is empty.'), true); h.focusField(2); return true; }

})(window);

    h.refocus();
  }
  function secsToLines(f) {
    var cols = { f: f.vt, i: 6, t: 7 }, lines = [];
    f.secs.forEach(function (s) {
      wrap(s[1], 38).forEach(function (l) { lines.push([[cols[s[0]] || 7, l]]); });
      lines.push('');
    });
    while (lines.length && lines[lines.length - 1] === '') lines.pop();
    return lines;
  }
  function speakMotto(h, text) { if (text) h.snd.speak(text, 'en-GB', 0.86, 0.82); }
  function stopSpeech() { try { if (global.speechSynthesis) speechSynthesis.cancel(); } catch (e) { /* rien */ } }

  var KM = {};   // modes

  /* ======================================================================
     Accueil
     ====================================================================== */
  // [mode, libellé FR, libellé EN] ; 1 et 2 ouvrent les branches, 3 le service KOINS
  var MENU = [
    ['MAIN', 'MAIN, TOUS', 'MAIN, ALL'],
    ['KORHOGO', 'KORHOGO, TOUS', 'KORHOGO, ALL'],
    ['@KOINS', 'KOINS', 'KOINS'],
    ['KAVE', 'FAUNA', 'FAUNA']
  ];
  /* ======================================================================
     MAIN, ALL — les services en ligne de la ligne (émulateurs Minitel).
     ====================================================================== */
  KM.MAIN = {
    help: function () {
      return [
        L('Les services en ligne du 3615.', 'The services on line at 3615.'),
        L('1 météo, 2 encyclo, 3 SNCF, 4 autres codes.', '1 weather, 2 encyclo, 3 SNCF, 4 other codes.'),
        '',
        L('Numéro puis ', 'Number, then ') + K('ENVOI') + '.'
      ];
    },
    enter: function (h) { this.h = h; this.render(h); },
    render: function (h) {
      var v = new Vdt();
      v.cls().cur(0);
      v.big(2, 3, 'MAIN', 7);
      v.pos(4, 22).fg(7).size('d').text(L('EN LIGNE', 'ON LINE'));
      UI.rule(v, 9, 4);
      var items = [
        ['METEO', L('la météo', 'the weather')],
        ['ENCYCLO', L("l'encyclopédie", 'the encyclopedia')],
        ['SNCF', L('les trains', 'trains')],
        ['MINITEL', L('autres codes', 'other codes')]
      ];
      items.forEach(function (it, i) {
        v.pos(11 + i, 1).fg(3).text(lpad(i + 1, 2) + '  ').fg(7).text(pad(it[0], 10)).fg(6).text(it[1]);
      });
      v.pos(17, 2).fg(7).text(L('Code ou n° :', 'Code or no.:'));
      v.pos(17, 16); UI.kbtn(v, 'ENVOI');
      UI.footer(v, [['KORHOGO!', 'SOMMAIRE'], [L('Aide', 'Help'), 'GUIDE']]);
      h.out(v);
      h.form([{ r: 17, c: 15, len: 12 }]);
    },
    key: function (h, k, vals) {
      if (k.fn !== 'ENVOI') return false;
      var q = norm(vals[0] || '').trim().toUpperCase(), n = parseInt(q, 10);
      if (n === 1) { h.go('METEO'); return true; }
      if (n === 2) { h.go('ENCYCLO'); return true; }
      if (n === 3) { h.go('MINITEL'); if (S.MINITEL && S.MINITEL.dial) S.MINITEL.dial('SNCF'); return true; }
      if (n === 4) { h.go('MINITEL'); return true; }
      if (q === 'SNCF') { h.go('MINITEL'); if (S.MINITEL && S.MINITEL.dial) S.MINITEL.dial('SNCF'); return true; }
      var name = S.resolve(q);
      if (!name) { h.clearField(0); h.bell(); return true; }
      if (name === 'KORHOGO') { KOR.open('KORHOGO'); return true; }
      if (name !== 'KIOSQUE') { h.go(name); return true; }
      h.clearField(0); h.bell();
      return true;
    }
  };

  /* ======================================================================
     KORHOGO, ALL — Tchat, BAL, Maukie.
     ====================================================================== */
  KM.KORHOGO = {
    help: function () {
      return [
        L('1 Tchat, 2 BAL, 3 Maukie, 4 Fauna.', '1 Chat, 2 Box, 3 Maukie, 4 Fauna.'),
        '',
        L('Numéro puis ', 'Number, then ') + K('ENVOI') + '.'
      ];
    },
    enter: function (h) { this.h = h; this.render(h); },
    render: function (h) {
      var v = new Vdt();
      v.cls().cur(0);
      v.big(2, 3, 'KORHOGO', 7);
      v.pos(8, 41 - L('TOUS', 'ALL').length).fg(7).text(L('TOUS', 'ALL'));
      UI.rule(v, 9, 4);
      var items = [
        [L('TCHAT', 'CHAT'), L('Direct Kaves, en direct', 'Direct Kaves, live')],
        [L('BAL', 'BOX'), L('Votre Kalabass', 'Your Kalabass')],
        [L('MAUKIE', 'MAUKIE'), L('laisser un mot', 'leave a word')],
        ['FAUNA', 'We are The Fauna!']
      ];
      items.forEach(function (it, i) {
        v.pos(11 + i, 1).fg(3).text(lpad(i + 1, 2) + '  ').fg(7).text(pad(it[0], 10)).fg(6).text(it[1]);
      });
      v.pos(17, 2).fg(7).text(L('Code ou n° :', 'Code or no.:'));
      v.pos(17, 16); UI.kbtn(v, 'ENVOI');
      UI.footer(v, [['KORHOGO!', 'SOMMAIRE'], [L('Aide', 'Help'), 'GUIDE']]);
      h.out(v);
      h.form([{ r: 17, c: 15, len: 12 }]);
    },
    key: function (h, k, vals) {
      if (k.fn !== 'ENVOI') return false;
      var q = norm(vals[0] || '').trim().toUpperCase(), n = parseInt(q, 10);
      if (n === 4 || /^(FAUNA|FICHES?|PROFILES?|MASKS?)$/.test(q)) { KOR.open('KAVE'); return true; }
      var view = n === 1 || q === 'TCHAT' || q === 'CHAT' || q === 'KAVE' ? 'rooms'
        : n === 2 || q === 'BAL' || q === 'BOX' || q === 'MSG' ? 'inbox'
        : n === 3 || q === 'MAUKIE' || q === 'MAUK' ? 'mauk' : null;
      if (!view) { h.clearField(0); h.bell(); return true; }
      h.go('MSG');
      var m = S.MSG;
      if (m) { m.view = view; m.page = 0; m.to = ''; m.render(); }
      return true;
    }
  };

  KM.HOME = {
    help: function () {
      return [
        [[3, ' 1 '], [7, pad(L('MAIN, TOUS', 'MAIN, ALL'), 18)], [6, L('météo, encyclo, SNCF…', 'weather, encyclo, SNCF…')]],
        [[3, ' 2 '], [7, pad(L('KORHOGO, TOUS', 'KORHOGO, ALL'), 18)], [6, L('Tchat, BAL, Maukie', 'Chat, Box, Maukie')]],
        [[3, ' 3 '], [7, pad('KOINS', 18)], [6, L('Truce vérifie', 'Truce checks')]],
        [[3, ' 4 '], [7, pad('FAUNA', 18)], [6, 'We are The Fauna!']],
        '',
        L('Numéro puis ', 'Number, then ') + K('ENVOI') + '.'
      ];
    },
    render: function (h) {
      var v = new Vdt();
      v.cls().cur(0);
      this.countBytes(v);
      v.pos(3, 21).fg(6).text('3615');
      v.big(4, 6, 'KORHOGO!', 3);
      MENU.forEach(function (m, i) {
        v.pos(12 + i, 9).fg(3).text(lpad(i + 1, 2) + '  ').fg(7).text(L(m[1], m[2]));
      });
      v.pos(16, 11).fg(7).text('>');
      v.pos(16, 17); UI.kbtn(v, 'ENVOI');
      UI.footer(v, [[L('Aide', 'Help'), 'GUIDE'], [L('Quitter', 'Quit'), 'CONNEXION/FIN']]);
      h.out(v);
      h.form([{ r: 16, c: 13, len: 10 }]);
      h.term.then(function () { setTimeout(function () { KOR.presence(); }, 0); });
    },
    // Nombre de connectés, en haut à droite, comme sur les services d'époque
    countBytes: function (v) {
      var NET = S.NET, t;
      if (!NET || !NET.ok) t = '';
      else if (!NET.started || !NET.relaysUp()) t = L('connexion au réseau...', 'reaching the network...');
      else t = UI.onlineText(NET.online());
      v.pos(1, 1).can();
      if (t) v.pos(1, 40 - t.length).fg(NET.started && NET.relaysUp() ? 2 : 5).text(t);
      return v;
    },
    key: function (h, k, vals) {
      if (k.fn !== 'ENVOI') return false;
      var q = norm(vals[0] || '').trim().toUpperCase(), n = parseInt(q, 10);
      if (n >= 1 && n <= MENU.length) {
        var go = MENU[n - 1][0];
        if (go.charAt(0) === '@') h.go(go.slice(1)); else KOR.open(go);
        return true;
      }
      /* branches nommées : MAIN → les services en ligne ; MINITEL… → kiosque (liste des services) ; KORHOGO… → Tchat, BAL, Maukie */
      if (/^MAIN\b/.test(q)) { KOR.open('MAIN'); return true; }
      if (/^(MINITEL|KIOSQUE|GATEWAY)\b/.test(q)) { h.go('KIOSQUE'); return true; }
      if (/^(KORHOGO|KOR)\b/.test(q)) { KOR.open('KORHOGO'); return true; }
      if (/^(FAUNA|FICHES?|PROFILES?|MASKS?)$/.test(q)) { KOR.open('KAVE'); return true; }
      h.clearField(0); h.bell();
      return true;
    }
  };

  /* ======================================================================
     ENTER KORHOGO — We are The Fauna!
     ====================================================================== */
  KM.KAVE = {
    help: function () {
      return [
        L('Numéro d\'un personnage, puis ', 'Type the number of a character, then ') + K('ENVOI') + '.',
        '',
        L('Sur une fiche :', 'On a profile:'),
        UI.hk('SUITE', 'page ou personnage suivant', 'next page, next character'),
        UI.hk('RETOUR', 'page précédente', 'previous page'),
        UI.hk('REPETITION', 'réentendre la devise', 'hear the motto again'),
        UI.hk('SOMMAIRE', 'retour à la liste', 'back to the list')
      ];
    },
    enter: function (h) { this.cur = -1; this.render(h); },
    leave: function () { stopSpeech(); },
    render: function (h) {
      stopSpeech();
      if (this.cur >= 0) { this.renderProf(h, true); return; }
      var v = kh(new Vdt(), 'ENTER KORHOGO');
      v.pos(6, 2).fg(3).size('h').text('We are The Fauna!');
      FAUNA.forEach(function (f, i) {
        var col = i < 9 ? 2 : 21, r = 8 + (i % 9);
        v.pos(r, col).fg(7).text(lpad(i + 1, 2) + ' ').fg(f.vt).text(cut(f.name, 15));
      });
      v.pos(21, 2).fg(7).text(L('Personnage n° :', 'Character no. :'));
      v.pos(21, 21); UI.kbtn(v, 'ENVOI');
      UI.footer(v, [['KORHOGO!', 'SOMMAIRE'], [L('Aide', 'Help'), 'GUIDE']]);
      h.out(v);
      h.form([{ r: 21, c: 18, len: 2 }]);
    },
    renderProf: function (h, full) {
      var f = FAUNA[this.cur], self = this;
      if (!this.lines) this.lines = secsToLines(f);
      var per = 15, pages = 1 + Math.ceil(this.lines.length / per);
      var sub = (this.page + 1) + '/' + pages;
      var v;
      h.clearForm();
      if (this.page === 0) {
        v = kh(new Vdt(), sub);
        drawFace(v, f, 5, 2);
        v.pos(6, 20).fg(f.vt).size('h').text(cut(f.name, 20));
        wrap(f.faction, 21).slice(0, 2).forEach(function (l, i) { v.pos(8 + i, 20).fg(6).text(l); });
        ['STR', 'DEX', 'INT', 'WIS', 'CHA', 'CON'].forEach(function (s, i) {
          var val = (f.stats && f.stats[s]) || 0;
          v.pos(11 + i, 20).fg(7).text(s + ' ').fg(f.vt).text(lpad(val, 2) + ' ');
          v.g1().fg(f.vt);
          if (val > 0) v.rep(0x2C, val);
          if (val < 10) v.fg(4).rep(0x24, 10 - val);
          v.g0();
        });
        wrap('"' + f.motto + '"', 38).slice(0, 2).forEach(function (l, i) { v.pos(20 + i, 2).fg(f.vt).text(l); });
        UI.keyHints(v, 23, [[L('Suite', 'Next'), 'SUITE'], [L('Retour', 'Back'), 'RETOUR']]);
        UI.footer(v, [['ENTER KORHOGO', 'SOMMAIRE'], [L('Aide', 'Help'), 'GUIDE']]);
        h.out(v);
        h.term.then(function () { if (h.svc === KOR && KOR.mode === KM.KAVE && self.page === 0) speakMotto(h, f.motto); });
        return;
      }
      var start = (this.page - 1) * per;
      if (full) {
        v = kh(new Vdt(), sub);
        v.pos(5, 2).fg(f.vt).size('h').text(cut(f.name, 38));
        UI.keyHints(v, 23, [[L('Suite', 'Next'), 'SUITE'], [L('Retour', 'Back'), 'RETOUR']]);
        UI.footer(v, [['ENTER KORHOGO', 'SOMMAIRE'], [L('Aide', 'Help'), 'GUIDE']]);
      } else {
        v = new Vdt().pos(2, 30).can().pos(2, 41 - sub.length).fg(7).text(sub);
      }
      for (var i = 0; i < per; i++) {
        var line = this.lines[start + i];
        if (!full) v.pos(7 + i, 1).can();
        if (line) UI.drawLine(v, 7 + i, 2, line);
      }
      h.out(v);
    },
    show: function (h, idx, page) {
      stopSpeech();
      var full = page === 0 || idx !== this.cur || this.page === 0 || this.page === undefined;
      if (idx !== this.cur) this.lines = null;
      this.cur = idx; this.page = page;
      this.renderProf(h, full);
    },
    repeat: function (h) {
      if (this.cur >= 0 && this.page === 0) { speakMotto(h, FAUNA[this.cur].motto); return true; }
      return false;
    },
    key: function (h, k, vals) {
      if (this.cur < 0) {
        if (k.fn !== 'ENVOI') return false;
        var n = parseInt(vals[0], 10);
        if (!(n >= 1 && n <= FAUNA.length)) { h.clearField(0); h.bell(); return true; }
        this.page = undefined;
        this.show(h, n - 1, 0);
        return true;
      }
      var pages = 1 + Math.ceil(secsToLines(FAUNA[this.cur]).length / 15);
      if (k.fn === 'SUITE' || k.fn === 'ENVOI') {
        if (this.page < pages - 1) {
          this.show(h, this.cur, this.page + 1);
          if (this.page === pages - 1 && S.KOIN && S.KOIN.fiche(FAUNA[this.cur].name)) msg(h, '+1 Koin', false, 2);
        }
        else this.show(h, (this.cur + 1) % FAUNA.length, 0);
        return true;
      }
      if (k.fn === 'RETOUR') {
        if (this.page > 0) this.show(h, this.cur, this.page - 1);
        else this.show(h, (this.cur + FAUNA.length - 1) % FAUNA.length, 0);
        return true;
      }
      if (k.fn === 'SOMMAIRE') { stopSpeech(); this.cur = -1; this.render(h); return true; }
      return !!k.ch;
    }
  };

  /* ======================================================================
     Service 3615 KORHOGO
     ====================================================================== */
  var KOR = {
    get help() { var x = (this.mode && this.mode.help) || KM.HOME.help; return typeof x === 'function' ? x() : x; },
    enter: function (h) { this.h = h; this.koinPlus = false; if (KOR.faunaOnce) { KOR.faunaOnce = false; this.mode = KM.HOME; KOR.open('KAVE'); return; } this.mode = KM.HOME; KM.HOME.render(h); },
    open: function (name) {
      var h = this.h;
      if (this.mode && this.mode.leave) this.mode.leave(h);
      h.term.flush();
      h.fm = null;
      this.mode = KM[name];
      if (this.mode.enter) this.mode.enter(h); else this.mode.render(h);
    },
    render: function () { this.mode.render(this.h); },
    repeat: function () {
      if (this.mode.repeat && this.mode.repeat(this.h)) return;
      this.h.term.flush();
      this.mode.render(this.h);
    },
    leave: function () { if (this.mode && this.mode.leave) this.mode.leave(this.h); stopSpeech(); },
    key: function (k, vals) {
      var h = this.h;
      if (this.mode.key(h, k, vals)) return true;
      if (k.fn === 'SOMMAIRE' && this.mode === KM.HOME) { h.term.flush(); KM.HOME.render(h); return true; }
      if (k.fn === 'SOMMAIRE' && this.mode !== KM.HOME) {
        if (this.mode.leave) this.mode.leave(h);
        stopSpeech();
        h.term.flush(); h.fm = null;
        this.mode = KM.HOME; KM.HOME.render(h);
        return true;
      }
      return false;
    }
  };
  KOR.presence = function () {
    var h = this.h;
    if (!h || h.svc !== KOR || this.mode !== KM.HOME || h.helpOpen || h.term.pending()) return;
    h.out(KM.HOME.countBytes(new Vdt()));
    h.refocus();
  };
  S.KORHOGO = KOR;

})(window);
</script>
<script>
/* ---- js/app.js ---- */
/* ==========================================================================
   Hôte : état de la ligne (local / appel / connecté), champs de saisie avec
   écho local, touches de fonction, clavier physique et virtuel, réglages.
   ========================================================================== */
(function () {
  'use strict';
  var global = window;
  var Vdt = VDX.Vdt, S = VDXServices, UI = VDXUI, norm = VDX.norm;

  var $ = function (id) { return document.getElementById(id); };
  var canvas = $('screen'), crt = $('crt');
  var term = new VDX.Terminal(canvas);
  var snd = new VDXSound();

  /* ---------- Préférences ------------------------------------------------- */
  function loadPref() {
    try { return JSON.parse(localStorage.getItem('vdx.prefs')) || {}; } catch (e) { return {}; }
  }
  var prefs = Object.assign({ baud: 4800, color: false, sound: true }, loadPref());
  function savePrefs() { try { localStorage.setItem('vdx.prefs', JSON.stringify(prefs)); } catch (e) { /* rien */ } }

  /* ---------- Page locale (terminal hors ligne) ---------------------------- */
  var LOCAL = {
    help: function () {
      return [
        L('Numéro puis ' + K('CONNEXION/FIN') + '.', 'Number, then ' + K('CONNEXION/FIN') + '.'),
        L('En ligne, 3615 propose', 'Online, 3615 offers'),
        L('Minitel, Korhogo et Koins.', 'Minitel, Korhogo and Koins.'),
        '',
        K('CONNEXION/FIN') + L(' raccroche à tout moment.', ' hangs up at any time.')
      ];
    },
    enter: function (h) { this.h = h; this.render(); },
    render: function () {
      var v = new Vdt();
      v.cls().cur(0);
      v.pos(3, 2).fg(7).size('d').text('3615');
      v.pos(5, 2).fg(6).text(L('Mode local, ligne ', 'Local mode, speed: ') + H.baudLabel());
      UI.rule(v, 7, 4);
      v.pos(9, 2).fg(7).text(L('Numéro :', 'Number:'));
      UI.footer(v, [[L('Appeler', 'Call'), 'CONNEXION/FIN'], [L('Aide', 'Help'), 'GUIDE']]);
      H.out(v);
      H.form([{ r: 9, c: 12, len: 24, value: H.lastNumber || '3615' }]);
    },
    key: function (k) {
      if (k.fn === 'ENVOI') { H.dial(); return true; }
      if (k.fn === 'SOMMAIRE') { this.render(); return true; }
      return false;
    }
  };
  S.LOCAL = LOCAL;

  /* ---------- Hôte ------------------------------------------------------- */
  var H = {
    term: term, snd: snd, state: 'local', svc: null, fm: null, helpOpen: false, powered: true, gen: 0,

    out: function (v) { term.send(v.bytes ? v.bytes() : v); },
    bell: function () { snd.beep(); },
    load: function (key, def) {
      try { var s = localStorage.getItem('vdx.' + key); return s == null ? def : JSON.parse(s); } catch (e) { return def; }
    },
    save: function (key, val) { try { localStorage.setItem('vdx.' + key, JSON.stringify(val)); } catch (e) { /* rien */ } },
    baudLabel: function () { return term.baud ? term.baud + L(' bauds', ' baud') : L('directe', 'unlimited'); },
    helpOf: function (svc) { return typeof svc.help === 'function' ? svc.help() : svc.help; },
    // Lettre clignotante en rangée 0 quand des messages attendent
    onPresence: function () { if (S.KORHOGO && S.KORHOGO.presence) S.KORHOGO.presence(); },
    notify: function (n) {
      this.unread = n;
      if (this.state !== 'online') return;
      term.status(n ? ' ' + L('MESSAGE', 'MAIL') + (n > 1 ? L('S ', ' ') : ' ') + n + ' ' : '', 'C', false, !!n);
    },

    fetchJSON: function (url) {
      var gen = this.gen;
      var ctl = global.AbortController ? new AbortController() : null;
      var t = setTimeout(function () { if (ctl) ctl.abort(); }, 12000);
      return fetch(url, ctl ? { signal: ctl.signal } : {}).then(function (r) {
        clearTimeout(t);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function (d) {
        if (gen !== H.gen) return new Promise(function () { });   // service quitté entre-temps
        return d;
      }, function (e) {
        clearTimeout(t);
        if (gen !== H.gen) return new Promise(function () { });
        throw e;
      });
    },

    /* ----- Champs de saisie ----- */
    form: function (fields, opts) {
      opts = opts || {};
      var fm = {
        f: fields.map(function (f) {
          return { r: f.r, c: f.c, len: f.len, value: norm(f.value || '').slice(0, f.len), filler: f.filler || '.', auto: !!f.auto };
        }),
        i: Math.min(opts.start || 0, fields.length - 1)
      };
      this.fm = fm;
      var v = new Vdt();
      fm.f.forEach(function (f) {
        v.pos(f.r, f.c).fg(7).text(f.value);
        if (f.len > f.value.length) v.rep(f.filler, f.len - f.value.length);
      });
      this.out(v);
      this.focusField(fm.i);
    },
    clearForm: function () { if (this.fm) { this.fm = null; this.out(new Vdt().cur(0)); } },
    values: function () { return this.fm ? this.fm.f.map(function (f) { return f.value; }) : []; },
    cursorPos: function (f) { return f.c + Math.min(f.value.length, f.len - 1); },
    focusField: function (i) {
      if (!this.fm) return;
      this.fm.i = i;
      var f = this.fm.f[i];
      this.out(new Vdt().pos(f.r, this.cursorPos(f)).cur(1));
    },
    refocus: function () { if (this.fm) this.focusField(this.fm.i); },
    redrawField: function (f, v) {
      v.pos(f.r, f.c).fg(7).text(f.value);
      if (f.len > f.value.length) v.rep(f.filler, f.len - f.value.length);
      return v;
    },
    clearField: function (i) {
      if (!this.fm || !this.fm.f[i]) return;
      var f = this.fm.f[i];
      f.value = '';
      var v = this.redrawField(f, new Vdt());
      this.out(v);
      this.refocus();
    },
    typeChar: function (raw) {
      var s = norm(raw);
      for (var k = 0; k < s.length; k++) this.typeOne(s[k]);
    },
    typeOne: function (ch) {
      var fm = this.fm, f = fm.f[fm.i], v = new Vdt();
      if (f.value.length >= f.len) {
        var nx = fm.f[fm.i + 1];
        if (!(f.auto && nx)) { this.bell(); return; }
        // renvoi à la ligne : le mot entamé passe sur la ligne suivante
        var sp = f.value.lastIndexOf(' ');
        if (ch !== ' ' && nx.auto && !nx.value && sp > 0 && sp < f.len - 1) {
          nx.value = f.value.slice(sp + 1);
          f.value = f.value.slice(0, sp + 1);
          this.redrawField(f, v);
          this.redrawField(nx, v);
        }
        if (ch === ' ' && !nx.value) { fm.i++; v.pos(nx.r, this.cursorPos(nx)).cur(1); term.now(v.bytes()); return; }
        fm.i++; f = nx;
        if (f.value.length >= f.len) { term.now(v.bytes()); this.bell(); return; }
      }
      var col = f.c + f.value.length;
      f.value += ch;
      v.pos(f.r, col).fg(7).text(ch);
      if (f.value.length >= f.len) v.pos(f.r, f.c + f.len - 1);
      v.cur(1);
      term.now(v.bytes());
    },
    correction: function () {
      var fm = this.fm, f = fm.f[fm.i];
      if (!f.value.length) {
        if (f.auto && fm.i > 0 && fm.f[fm.i - 1].auto) { this.focusField(fm.i - 1); return; }
        this.bell(); return;
      }
      f.value = f.value.slice(0, -1);
      var col = f.c + f.value.length;
      term.now(new Vdt().pos(f.r, col).fg(7).text(f.filler).pos(f.r, col).cur(1).bytes());
    },
    annulation: function () {
      var f = this.fm.f[this.fm.i];
      if (!f.value.length) return false;
      f.value = '';
      term.now(this.redrawField(f, new Vdt()).pos(f.r, f.c).cur(1).bytes());
      return true;
    },

    /* ----- Navigation ----- */
    go: function (name) {
      var s = S[name];
      if (!s) return;
      if (this.svc && this.svc.leave) this.svc.leave();
      this.gen++;
      term.flush();
      this.fm = null;
      this.helpOpen = false;
      this.svc = s;
      s.name = name;
      s.enter(this);
    },
    showHelp: function (svc) {
      var v = new Vdt();
      this.fm = null;
      this.helpOpen = true;
      if (svc === S.KORHOGO || svc === S.MSG) UI.kheader(v, K('GUIDE') + (svc === S.MSG ? ' / MSG' : ''));
      else UI.header(v, K('GUIDE'), svc === LOCAL ? 'Terminal' : (svc.name === 'KIOSQUE' ? '3615' : S.code(svc.name)));
      this.helpOf(svc).slice(0, 18).forEach(function (l, i) { UI.drawLine(v, 5 + i, 3, l); });
      v.pos(24, 2).fg(6).text(L('Une touche pour revenir à la page.', 'Press any key to go back.'));
      term.flush();
      this.out(v);
    },

    /* ----- Ligne téléphonique ----- */
    dial: function () {
      var raw = String(this.values()[0] || '3615');
      /* 3615 KOINS, 3615koins, 36 15 Koins… : spaces and capitals do not matter */
      var m = norm(raw).toUpperCase().replace(/^\s*[\d ]+/, function (d) { return d.replace(/ /g, '') + ' '; }).match(/^\s*(\d{4,10})\s*(.*)$/);
      if (!m) { UI.message(this, L('Tapez un numéro, par exemple 3615.', 'Type a number, for example 3615.'), true); return; }
      var num = m[1], code = m[2].trim();
      this.lastNumber = raw.trim();
      this.state = 'dialing';
      this.gen++;
      this.clearForm();
      term.flush();
      term.status('', 'C', true);
      this.out(new Vdt().pos(22, 1).can().pos(22, 2).fg(7).text(L('Appel du ' + num + ' en cours...', 'Calling ' + num + '...')));
      setLeds();
      var dur = snd.dial(num, !term.baud);
      var self = this;
      this.dialTimer = setTimeout(function () { self.connected(num, code); }, Math.max(dur * 1000, 1500));
    },
    connected: function (num, code) {
      if (num !== '3615') {
        this.state = 'local';
        term.status('', 'F');
        snd.hangup();
        setLeds();
        this.go('LOCAL');
        UI.message(this, L('Le ' + num + ' ne répond pas. Essayez le 3615.', num + ' does not answer. Try 3615.'), true);
        return;
      }
      this.state = 'online';
      term.status('', 'C', false);
      setLeds();
      // dès la connexion : on compte parmi les connectés, et les messages différés sont signalés
      if (S.NET && S.NET.ok) { S.NET.start(); this.notify(S.NET.unread()); }
      var name = code ? S.resolve(code) : null;
      this.go(name || 'KORHOGO');
      if (code && !name) UI.message(this, L('Service inconnu : ', 'Unknown service: ') + UI.cut(code, 18), true);
    },
    hangup: function () {
      clearTimeout(this.dialTimer);
      if (S.NET) S.NET.stop();
      this.unread = 0;
      if (this.svc && this.svc.leave) this.svc.leave();
      this.svc = null;
      snd.hangup();
      this.state = 'local';
      term.status('', 'F');
      setLeds();
      this.go('LOCAL');
    },

    /* ----- Touches ----- */
    key: function (k) {
      if (!this.powered) return;
      snd.ensure();
      if (this.state === 'dialing') { if (k.fn === 'CONNEXION') this.hangup(); else if (k.fn || k.ch) this.bell(); return; }
      if (k.fn === 'CONNEXION') { if (this.state === 'online') this.hangup(); else this.dial(); return; }
      var svc = this.svc;
      if (!svc) return;
      if (this.helpOpen) { this.helpOpen = false; term.flush(); svc.render(); return; }
      if (k.fn === 'GUIDE' && svc.help && this.helpOf(svc)) { this.showHelp(svc); return; }
      if (k.fn === 'REPETITION') { term.flush(); if (svc.repeat) svc.repeat(); else svc.render(); return; }
      var fm = this.fm;
      if (fm) {
        if (k.ch) { this.typeChar(k.ch); return; }
        if (k.fn === 'CORRECTION') { this.correction(); return; }
        if (k.fn === 'ANNULATION' && this.annulation()) return;
        if (fm.f.length > 1 && k.fn === 'SUITE') { if (fm.i < fm.f.length - 1) this.focusField(fm.i + 1); else this.bell(); return; }
        if (fm.f.length > 1 && k.fn === 'RETOUR') { if (fm.i > 0) this.focusField(fm.i - 1); else this.bell(); return; }
      }
      if (svc.key(k, this.values())) return;
      if (k.fn === 'SOMMAIRE') {
        // Korhogo est le sommaire général ; les services du kiosque reviennent au kiosque
        var up = svc === S.KIOSQUE || svc === S.MSG || svc === S.KOINS ? 'KORHOGO' : svc === S.KORHOGO ? null : 'KIOSQUE';
        if (this.state === 'online' && up) this.go(up); else { term.flush(); svc.render(); }
        return;
      }
      if (k.fn || k.dir) this.bell();
    },

  };
  global.VDXHost = H;

  /* ---------- Voyants et réglages ---------------------------------------- */
  var ledLine = $('led-line'), ledData = $('led-data');
  function setLeds() {
    ledLine.classList.toggle('on', H.state === 'online');
    ledLine.classList.toggle('blink', H.state === 'dialing');
  }
  term.onbusy = function (busy) { ledData.classList.toggle('on', busy); };
  term.onbell = function () { snd.beep(); };

  function applyPrefs() {
    term.baud = prefs.baud;
    term.rend.mode = prefs.color ? 'color' : 'mono';
    term.dirty = true;
    snd.on = prefs.sound;
    document.querySelectorAll('[data-baud]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(+b.dataset.baud === prefs.baud));
    });
    $('sw-color').setAttribute('aria-checked', String(prefs.color));
    $('sw-sound').setAttribute('aria-checked', String(prefs.sound));
    crt.classList.toggle('color', prefs.color);
  }
  document.querySelectorAll('[data-baud]').forEach(function (b) {
    b.addEventListener('click', function () { prefs.baud = +b.dataset.baud; savePrefs(); applyPrefs(); });
  });
  // après un clic sur un réglage, la frappe revient au terminal
  document.querySelectorAll('.controls button').forEach(function (b) {
    b.addEventListener('click', function () { if (b.id !== 'kbd-btn') b.blur(); });
  });
  $('sw-color').addEventListener('click', function () { prefs.color = !prefs.color; savePrefs(); applyPrefs(); });
  $('sw-sound').addEventListener('click', function () {
    prefs.sound = !prefs.sound; savePrefs(); applyPrefs();
    if (prefs.sound) snd.beep();
  });
  $('power').addEventListener('click', function () { setPower(!H.powered); });

  /* ---------- Langue : français / anglais -------------------------------- */
  function applyLang() {
    I18N.applyDom();
    document.querySelectorAll('[data-lang]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.lang === I18N.lang));
    });
  }
  document.querySelectorAll('[data-lang]').forEach(function (b) {
    b.addEventListener('click', function () {
      I18N.set(b.dataset.lang);
      applyLang();
      b.blur();
      if (!H.powered || !H.svc) return;
      term.flush(); H.fm = null;
      if (H.helpOpen) H.showHelp(H.svc); else H.svc.render();
      if (H.state === 'online') H.notify(H.unread || 0);
    });
  });

  function setPower(on) {
    H.powered = on;
    $('power').setAttribute('aria-pressed', String(on));
    if (!on) {
      if (H.state !== 'local') { clearTimeout(H.dialTimer); if (H.svc && H.svc.leave) H.svc.leave(); if (S.NET) S.NET.stop(); }
      H.state = 'local'; H.svc = null; H.fm = null;
      term.reset(); term.status('', '');
      crt.classList.add('off');
      setLeds();
      return;
    }
    crt.classList.remove('off');
    crt.classList.remove('boot'); void crt.offsetWidth; crt.classList.add('boot');
    term.reset();
    term.status('', 'F');
    H.go('LOCAL');
  }

  /* ---------- Clavier physique ------------------------------------------- */
  function mapKey(e) {
    switch (e.key) {
      case 'Enter': return { fn: 'ENVOI' };
      case 'Backspace': return { fn: 'CORRECTION' };
      case 'Delete': return { fn: 'ANNULATION' };
      case 'Escape': return { fn: 'SOMMAIRE' };
      case 'Tab': return { fn: e.shiftKey ? 'RETOUR' : 'SUITE' };
      case 'PageDown': return { fn: 'SUITE' };
      case 'PageUp': return { fn: 'RETOUR' };
      case 'F1': return { fn: 'GUIDE' };
      case 'F2': return { fn: 'REPETITION' };
      case 'F9': case 'F10': return { fn: 'CONNEXION' };
      case 'ArrowUp': return { dir: 'U' };
      case 'ArrowDown': return { dir: 'D' };
      case 'ArrowLeft': return { dir: 'L' };
      case 'ArrowRight': return { dir: 'R' };
    }
    return null;
  }
  var kbd = $('kbd');
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && t !== kbd && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;
    if (e.ctrlKey || e.metaKey || e.altKey) { if (!(e.key === 'Enter' && e.ctrlKey)) return; }
    var k = mapKey(e);
    if (k) {
      e.preventDefault();
      H.key(k);
      flashKey(k.fn);
      return;
    }
    if (t === kbd) return;                     // géré par l'événement input
    if (e.key && e.key.length === 1) {
      if (t && t.tagName === 'BUTTON' && e.key === ' ') return;
      e.preventDefault();
      H.key({ ch: e.key });
    }
  });

  /* ---------- Clavier virtuel (mobiles) : zone de saisie cachée ---------- */
  var SENT = '  ';
  function resetKbd() { kbd.value = SENT; try { kbd.setSelectionRange(SENT.length, SENT.length); } catch (e) { /* rien */ } }
  resetKbd();
  kbd.addEventListener('input', function () {
    var v = kbd.value;
    if (v.length < SENT.length) H.key({ fn: 'CORRECTION' });
    else {
      var ins = v.slice(SENT.length);
      for (var i = 0; i < ins.length; i++) {
        if (ins[i] === '\n') H.key({ fn: 'ENVOI' }); else H.key({ ch: ins[i] });
      }
    }
    resetKbd();
  });
  function focusKbd() { try { kbd.focus({ preventScroll: true }); } catch (e) { kbd.focus(); } resetKbd(); }
  crt.addEventListener('click', function () { if (matchMedia('(pointer: coarse)').matches) focusKbd(); });
  $('kbd-btn').addEventListener('click', focusKbd);

  /* ---------- Touches à l'écran ------------------------------------------ */
  function flashKey(fn) {
    if (!fn) return;
    var el = document.querySelector('[data-fn="' + fn + '"]');
    if (!el) return;
    el.classList.add('down');
    setTimeout(function () { el.classList.remove('down'); }, 120);
  }
  document.querySelectorAll('[data-fn]').forEach(function (b) {
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); });
    b.addEventListener('click', function () { snd.ensure(); snd.click(); H.key({ fn: b.dataset.fn }); });
  });
  document.querySelectorAll('[data-ch]').forEach(function (b) {
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); });
    b.addEventListener('click', function () { snd.ensure(); snd.click(); H.key({ ch: b.dataset.ch }); });
  });

  /* ---------- (retrait du lecteur .vdt) ---------------------------------- */

  /* ---------- Police : on redessine une fois VT323 chargée ---------------- */
  if (document.fonts && document.fonts.load) {
    document.fonts.load('30px "VT323"').then(function () { term.rend.measure(); term.dirty = true; }, function () { });
  }

  /* ---------- Démarrage -------------------------------------------------- */
  applyPrefs();
  applyLang();
  term.status('', 'F');
  H.go('LOCAL');
  /* Lien depuis l'arcade, badge en haut à droite de l'écran de présentation : ?svc=koins */
  try {
    var _q = new URLSearchParams(location.search);
    var _svc = (_q.get('svc') || (location.hash || '').replace(/^#/, '')).toLowerCase();
    /* from the arcade's Minitel: straight to 3615 KORHOGO, the line dials by itself */
    if (_svc === 'korhogo' && H.state === 'local') {
      H.lastNumber = '3615 KORHOGO';
      if (S.KORHOGO) S.KORHOGO.faunaOnce = true;   /* the arcade lands on the Fauna, the list of the Masks */
      H.go('LOCAL');
      setTimeout(function () { H.dial(); }, 700);
    }
    if (_svc === 'koins' && H.state === 'local') {
      H.lastNumber = '3615 KOINS';
      H.gateOnce = true;   /* après le crédit KOINS, on débouche sur l'accueil */
      H.go('LOCAL');
      H.dial();
    }
  } catch (e) { /* rien */ }
})();
</script>
<script>
/* [IK] a Koin earned here falls through the screen, the way a coin drops into a slot */
function koinDrop(n){
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  var sc = document.getElementById('screen'); if (!sc) return;
  var r = sc.getBoundingClientRect(), A = window.AudioContext || window.webkitAudioContext, ac = null;
  try { ac = koinDrop.ac || (koinDrop.ac = A ? new A() : null); } catch (e) {}
  for (var i = 0; i < Math.min(n, 6); i++) (function (i) {
    var c = document.createElement('span');
    c.textContent = '\u25C9';
    c.setAttribute('aria-hidden', 'true');
    c.style.cssText = 'position:fixed;z-index:50;pointer-events:none;font:18px monospace;color:#ffe08a;text-shadow:0 0 10px rgba(255,224,138,.9);left:' + (r.left + r.width * (.42 + Math.random() * .16)) + 'px;top:' + r.top + 'px';
    document.body.appendChild(c);
    var a = c.animate([
      { transform: 'translateY(-20px) rotateY(0deg)', opacity: 0 },
      { opacity: 1, offset: .1 },
      { transform: 'translateY(' + (r.height - 10) + 'px) rotateY(900deg)', opacity: 1, offset: .9 },
      { transform: 'translateY(' + r.height + 'px) rotateY(1080deg)', opacity: 0 }
    ], { duration: 1100, delay: i * 200, easing: 'cubic-bezier(.45,0,.9,.55)', fill: 'both' });
    a.onfinish = function () {
      c.remove();
      if (!ac) return;
      try {
        var t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(2093, t); o.frequency.setValueAtTime(3136, t + .04);
        g.gain.setValueAtTime(.05, t); g.gain.exponentialRampToValueAtTime(.0001, t + .16);
        o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .17);
      } catch (e) {}
    };
  })(i);
}
</script>
